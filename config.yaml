browser:
  channel: chrome
  profile_dir: ./.browser-profile
  login_url: https://wenshu.court.gov.cn/website/wenshu/181010CARHS5BS3C/index.html?open=login
  search_url: https://wenshu.court.gov.cn/website/wenshu/181217BMTKHNT2W0/index.html

  # 登录态失效时，自动填充官网登录页并点击登录；验证码仍由用户在浏览器中手工完成。
  auto_login: true
  login_username_env: WENSHU_USERNAME
  login_password_env: WENSHU_PASSWORD
  login_page_timeout_seconds: 60
  login_wait_timeout_seconds: 600
  site_ready_timeout_seconds: 90
  site_ready_reload_attempts: 3
  query_wait_timeout_seconds: 600

storage:
  output_root: ''

collection:
  strategy: bank_party_date_bisect
  page_size: 5
  site_visible_limit: 600
  request_interval_seconds: 0.5
  max_download_retries: 3
  query_condition_verify_retries: 3

  # 手工排序 HAR 已确认 s51:desc / s51:asc 都能保留日期条件。
  # 日期查询走官网 loadData 原生链路，page_size=5 与成功 HAR 一致。
  sort_fields: s51:desc

  # 用户要求：本地下载记录作为去重权威来源。
  # 若本地已有成功下载文书，取其中最大的裁判日期作为本轮检索上界。
  # 例如本地最大裁判日期为 2026-06-11，则只检索 ... ~ 2026-06-11（包含当天）。
  # 在新的原生日期查询链路真实通过 probe 前，暂不按本地最大裁判日期裁剪远端范围。
  # 这样即使中途停止也优先保证不漏文书；下载前 docId/元数据去重仍会避免重复下载。
  resume_from_local_latest: false

  # 已完整完成且结束日期早于今天的历史切片直接跳过，避免重跑时重复翻页。
  # 未完成切片、今天及未来范围仍重新查询；文书下载继续由 documents 表做最终去重。
  skip_completed_slices: true

  # 只有单日仍 >600 时才使用 facet 继续细分。
  overflow_facets:
    - s33
    - s39
    - s40
    - s4
    - s8
    - s6

  query_seeds:
    - group: BANK_PARTY
      name: 银行作为当事人
      topics:
        - BANK_PARTY
      conditions:
        - key: s17
          value: 银行
      note: 当事人字段包含银行；日期超600递归二分
      enabled: true
